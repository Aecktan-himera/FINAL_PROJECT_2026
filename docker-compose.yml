version: "3.8"
services:
  postgres:
    image: postgres:17-alpine
    container_name: tasktracker-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8.6-alpine
    container_name: tasktracker-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: tasktracker-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
    - "9000:9000"
    - "9001:9001"
    volumes:
    - minio_data:/data
volumes:
  pgdata:
  minio_data:
